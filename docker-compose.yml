version: '3.8'
services:
  mongodb:
    image: mongo:7.0
    container_name: accounting-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
      MONGO_INITDB_DATABASE: accounting_db
    volumes:
      - mongodb_data:/data/db
      - ./init-data:/docker-entrypoint-initdb.d

  minio:
    image: minio/minio:latest
    container_name: accounting-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

volumes:
  mongodb_data:
  minio_data:
